[defaults]
# Ansible configuration file for this project

# Inventory file location
inventory = ./inventories/inventory.ini

# Host key checking - set to False for testing
host_key_checking = False

# Connection settings
timeout = 10
gather_timeout = 10

# Output settings
force_color = True
nocows = False

# Logging
log_path = ./ansible.log

# SSH settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Privilege escalation
become = False
become_method = sudo
become_user = root
become_ask_pass = False

# Callback settings
stdout_callback = human_friendly

# Defaults
remote_tmp = /tmp/.ansible/tmp
