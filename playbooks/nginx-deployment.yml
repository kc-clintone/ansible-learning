---
# nginx-deployment.yml - Advanced Nginx playbook with variables and handlers
# Week 2 project: More complex deployment with multiple tasks
# Run with: ansible-playbook playbooks/nginx-deployment.yml

- hosts: webservers
  become: yes
  vars:
    nginx_port: 80
    nginx_user: www-data
    nginx_worker_processes: 4
    nginx_max_open_files: 65535

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted

    - name: validate nginx
      command: nginx -t
      register: nginx_test
      notify: restart nginx

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - curl
          - wget
          - net-tools
        state: present

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Create Nginx config backup
      copy:
        src: /etc/nginx/nginx.conf
        dest: /etc/nginx/nginx.conf.bak
        remote_src: yes
        backup: yes

    - name: Configure Nginx worker processes
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: "worker_processes"
        line: "worker_processes {{ nginx_worker_processes }};"
      notify: restart nginx

    - name: Configure max open files
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: "worker_rlimit_nofile"
        line: "worker_rlimit_nofile {{ nginx_max_open_files }};"
      notify: restart nginx

    - name: Create web root directory
      file:
        path: /var/www/html
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
        mode: "0755"

    - name: Create index.html
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Ansible Managed Nginx</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 50px; }
                  .info { background: #f0f0f0; padding: 20px; border-radius: 5px; }
              </style>
          </head>
          <body>
              <h1>Nginx is Running!</h1>
              <div class="info">
                  <p>This server was configured by Ansible</p>
                  <p>Hostname: {{ ansible_hostname }}</p>
                  <p>IP Address: {{ ansible_default_ipv4.address }}</p>
              </div>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
      notify: restart nginx

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

   - name: Wait for Nginx to be ready
      wait_for:
        port: "{{ nginx_port }}"
        state: started
        timeout: 10

    - name: Test Nginx connectivity
      uri:
        url: "http://localhost:{{ nginx_port }}"
        status_code: 200
      register: nginx_test_result

    - name: Display deployment summary
      debug:
        msg: |
          ✓ Nginx deployed successfully!
          - Host: {{ ansible_hostname }}
          - IP: {{ ansible_default_ipv4.address }}
          - Port: {{ nginx_port }}
          - Worker Processes: {{ nginx_worker_processes }}
          - Status: {{ nginx_test_result.status }}

  post_tasks:
    - name: Generate deployment report
      shell: |
        echo "Nginx Deployment Report - $(date)" > /tmp/deployment.log
        echo "Hostname: $(hostname)" >> /tmp/deployment.log
        echo "Nginx Version: $(nginx -v 2>&1)" >> /tmp/deployment.log
        echo "Nginx Status: $(systemctl is-active nginx)" >> /tmp/deployment.log
      changed_when: false
