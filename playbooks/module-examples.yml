---
# module-examples.yml - Practical examples of commonly used Ansible modules
# Week 2 learning: Deep dive into modules
# Run with: ansible-playbook playbooks/module-examples.yml

# APT MODULE EXAMPLES
- hosts: webservers
  gather_facts: yes
  tasks:
    - name: "APT MODULE - Update all packages"
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: "APT MODULE - Install single package"
      apt:
        name: curl
        state: present

    - name: "APT MODULE - Install multiple packages"
      apt:
        name:
          - git
          - htop
          - wget
          - vim
        state: present

    - name: "APT MODULE - Remove package"
      apt:
        name: apache2
        state: absent

    - name: "APT MODULE - Autoremove unused packages"
      apt:
        autoremove: yes

---
# SERVICE MODULE EXAMPLES
- hosts: webservers
  tasks:
    - name: "SERVICE MODULE - Start service"
      service:
        name: nginx
        state: started

    - name: "SERVICE MODULE - Restart service"
      service:
        name: nginx
        state: restarted

    - name: "SERVICE MODULE - Stop service"
      service:
        name: nginx
        state: stopped

    - name: "SERVICE MODULE - Enable on boot"
      service:
        name: nginx
        enabled: yes

    - name: "SERVICE MODULE - Get service status"
      service_facts:
      register: service_facts

    - name: "Display nginx status"
      debug:
        msg: "{{ service_facts.ansible_facts.services['nginx.service'] }}"

---
# COPY MODULE EXAMPLES
- hosts: webservers
  tasks:
    - name: "COPY MODULE - Copy single file"
      copy:
        src: /local/config/nginx.conf
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        backup: yes

    - name: "COPY MODULE - Copy with inline content"
      copy:
        content: |
          server {
              listen 80;
              server_name localhost;
          }
        dest: /etc/nginx/sites-available/default

    - name: "COPY MODULE - Copy entire directory"
      copy:
        src: /local/webroot/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: "0755"
        recurse: yes

    - name: "COPY MODULE - Create file with permissions"
      copy:
        content: "This is a config file"
        dest: /etc/myapp/config.conf
        mode: "0600"
        owner: appuser
